spring.application.name=order-service
server.port=8081

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/order_db}

service.inventory.url=${SERVICE_INVENTORY_URL:http://localhost:8083}
service.payment.url=${SERVICE_PAYMENT_URL:http://localhost:8082}
service.shipping.url=${SERVICE_SHIPPING_URL:http://localhost:8084}
service.notification.url=${SERVICE_NOTIFICATION_URL:http://localhost:8086}

# Actuator — expose health + prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Distributed tracing → Jaeger via OTLP
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# JWT configuration
# Override JWT_SECRET in production via environment variable — must be >= 32 chars
jwt.secret=${JWT_SECRET:cascade-failure-prediction-super-secret-key-2024-min32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
