spring.application.name=order-service
server.port=8081

spring.datasource.url=jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

service.inventory.url=http://localhost:8083
service.payment.url=http://localhost:8082
service.shipping.url=http://localhost:8084
service.notification.url=http://localhost:8086
