global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'cascading-failure-prediction'

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['172.28.0.26:8080']
        labels:
          service: 'api-gateway'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['172.28.0.25:8081']
        labels:
          service: 'order-service'

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['172.28.0.23:8082']
        labels:
          service: 'payment-service'

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['172.28.0.22:8083']
        labels:
          service: 'inventory-service'

  - job_name: 'shipping-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['172.28.0.24:8084']
        labels:
          service: 'shipping-service'

  - job_name: 'delivery-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['172.28.0.21:8085']
        labels:
          service: 'delivery-service'

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['172.28.0.20:8086']
        labels:
          service: 'notification-service'
