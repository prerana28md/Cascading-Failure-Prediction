global:
  scrape_interval: 15s        # How often Prometheus scrapes each target
  evaluation_interval: 15s    # How often rules are evaluated
  external_labels:
    project: 'cascading-failure-prediction'

scrape_configs:

  # ── Prometheus self-monitoring ───────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── API Gateway ─────────────────────────────────────────────────────────────
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'

  # ── Order Service ────────────────────────────────────────────────────────────
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['order-service:8081']
        labels:
          service: 'order-service'

  # ── Payment Service ──────────────────────────────────────────────────────────
  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['payment-service:8082']
        labels:
          service: 'payment-service'

  # ── Inventory Service ────────────────────────────────────────────────────────
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['inventory-service:8083']
        labels:
          service: 'inventory-service'

  # ── Shipping Service ─────────────────────────────────────────────────────────
  - job_name: 'shipping-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['shipping-service:8084']
        labels:
          service: 'shipping-service'

  # ── Delivery Service ─────────────────────────────────────────────────────────
  - job_name: 'delivery-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['delivery-service:8085']
        labels:
          service: 'delivery-service'

  # ── Notification Service ─────────────────────────────────────────────────────
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['notification-service:8086']
        labels:
          service: 'notification-service'
