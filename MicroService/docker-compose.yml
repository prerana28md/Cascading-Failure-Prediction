# ─── Reusable health-check defaults ──────────────────────────────────────────
x-healthcheck-defaults: &spring-healthcheck
  interval: 20s
  timeout: 10s
  retries: 5
  start_period: 45s

# ─── Common environment injected into every microservice ─────────────────────
x-service-env: &common-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://172.28.0.30:4318"
  JAVA_OPTS: "-Dsun.net.inetaddr.ttl=30 -Dnetworkaddress.cache.ttl=30 -Dsun.net.inetaddr.negative.ttl=0 -Djava.net.preferIPv4Stack=true"

# ─── Reusable MongoDB Atlas host entries (bypasses DNS — needed on Windows Docker) ──
x-mongo-hosts: &mongo-hosts
  extra_hosts:
    - "ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:159.41.227.47"
    - "ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:159.41.168.127"
    - "ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:159.41.245.217"
    # ── Inter-service hostnames resolved via static IP (UDP/53 blocked on this host) ──
    - "notification-service:172.28.0.20"
    - "delivery-service:172.28.0.21"
    - "inventory-service:172.28.0.22"
    - "payment-service:172.28.0.23"
    - "shipping-service:172.28.0.24"
    - "order-service:172.28.0.25"
    - "api-gateway:172.28.0.26"
    - "jaeger:172.28.0.30"
    - "prometheus:172.28.0.31"


services:

  # ════════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY STACK  (starts first — no service dependencies)
  # ════════════════════════════════════════════════════════════════════════════

  # ── Jaeger  (traces) — UI: 16686 | OTLP HTTP: 4318 ────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.30

  # ── Prometheus  (metrics) — UI: 9090 ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.31

  # ── Loki  (log aggregation) — port 3100 ───────────────────────────────────
  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    user: "0"
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.32

  # ── Promtail  (log shipper: Docker → Loki) ────────────────────────────────
  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - cascade-net

  # ── Grafana  (dashboards) — UI: 3001 ──────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.3
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped
    networks:
      - cascade-net

  # ════════════════════════════════════════════════════════════════════════════
  # MICROSERVICES  (start after observability is up)
  # ════════════════════════════════════════════════════════════════════════════

  # ── Notification Service  (port 8086)  ────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: cascade/notification-service:latest
    container_name: notification-service
    <<: *mongo-hosts
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_USER:-Poornima15}:${MONGO_PASS:-poornima15}@ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:27017/notification_db?authSource=admin&replicaSet=atlas-crtyi8-shard-0&tls=true&retryWrites=true&w=majority"
    depends_on:
      - jaeger
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      <<: *spring-healthcheck
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.20

  # ── Delivery Service  (port 8085)  ────────────────────────────────────────
  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    image: cascade/delivery-service:latest
    container_name: delivery-service
    <<: *mongo-hosts
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_USER:-Poornima15}:${MONGO_PASS:-poornima15}@ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:27017/delivery_db?authSource=admin&replicaSet=atlas-crtyi8-shard-0&tls=true&retryWrites=true&w=majority"
    depends_on:
      - jaeger
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      <<: *spring-healthcheck
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.21

  # ── Inventory Service  (port 8083)  ───────────────────────────────────────
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    image: cascade/inventory-service:latest
    container_name: inventory-service
    <<: *mongo-hosts
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_USER:-Poornima15}:${MONGO_PASS:-poornima15}@ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:27017/inventory_db?authSource=admin&replicaSet=atlas-crtyi8-shard-0&tls=true&retryWrites=true&w=majority"
      JWT_SECRET: "${JWT_SECRET:-cascade-failure-prediction-super-secret-key-2024-min32chars}"
    depends_on:
      - jaeger
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      <<: *spring-healthcheck
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.22

  # ── Payment Service  (port 8082)  ─────────────────────────────────────────
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: cascade/payment-service:latest
    container_name: payment-service
    <<: *mongo-hosts
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_USER:-Poornima15}:${MONGO_PASS:-poornima15}@ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:27017/payment_db?authSource=admin&replicaSet=atlas-crtyi8-shard-0&tls=true&retryWrites=true&w=majority"
      SERVICE_NOTIFICATION_URL: "http://172.28.0.20:8086"
    depends_on:
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      <<: *spring-healthcheck
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.23

  # ── Shipping Service  (port 8084)  ────────────────────────────────────────
  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    image: cascade/shipping-service:latest
    container_name: shipping-service
    <<: *mongo-hosts
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_USER:-Poornima15}:${MONGO_PASS:-poornima15}@ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:27017/shipping_db?authSource=admin&replicaSet=atlas-crtyi8-shard-0&tls=true&retryWrites=true&w=majority"
      SERVICE_DELIVERY_URL: "http://172.28.0.21:8085"
      SERVICE_NOTIFICATION_URL: "http://172.28.0.20:8086"
    depends_on:
      delivery-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      <<: *spring-healthcheck
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.24

  # ── Order Service  (port 8081)  ───────────────────────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: cascade/order-service:latest
    container_name: order-service
    <<: *mongo-hosts
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_USER:-Poornima15}:${MONGO_PASS:-poornima15}@ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:27017/order_db?authSource=admin&replicaSet=atlas-crtyi8-shard-0&tls=true&retryWrites=true&w=majority"
      SERVICE_INVENTORY_URL: "http://172.28.0.22:8083"
      SERVICE_PAYMENT_URL: "http://172.28.0.23:8082"
      SERVICE_SHIPPING_URL: "http://172.28.0.24:8084"
      SERVICE_NOTIFICATION_URL: "http://172.28.0.20:8086"
      JWT_SECRET: "${JWT_SECRET:-cascade-failure-prediction-super-secret-key-2024-min32chars}"
      JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS:-86400000}"
    depends_on:
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      <<: *spring-healthcheck
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.25

  # ── API Gateway  (port 8080)  ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: cascade/api-gateway:latest
    container_name: api-gateway
    <<: *mongo-hosts
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      SERVICE_ORDER_URL: "http://172.28.0.25:8081"
      SERVICE_PAYMENT_URL: "http://172.28.0.23:8082"
      SERVICE_INVENTORY_URL: "http://172.28.0.22:8083"
      SERVICE_SHIPPING_URL: "http://172.28.0.24:8084"
      SERVICE_DELIVERY_URL: "http://172.28.0.21:8085"
      SERVICE_NOTIFICATION_URL: "http://172.28.0.20:8086"
      JWT_SECRET: "${JWT_SECRET:-cascade-failure-prediction-super-secret-key-2024-min32chars}"
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      <<: *spring-healthcheck
    restart: unless-stopped
    networks:
      cascade-net:
        ipv4_address: 172.28.0.26

  # ── Frontend  (port 3000 → nginx 80)  ─────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: cascade/frontend:latest
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cascade-net

# ════════════════════════════════════════════════════════════════════════════
# VOLUMES  (persistent storage for observability data)
# ════════════════════════════════════════════════════════════════════════════
volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  cascade-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
