spring.application.name=shipping-service
server.port=8084

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://Poornima15:poornima15@ac-oscdkrc-shard-00-00.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-01.f46nymd.mongodb.net:27017,ac-oscdkrc-shard-00-02.f46nymd.mongodb.net:27017/shipping_db?authSource=admin&replicaSet=atlas-crtyi8-shard-0&tls=true&retryWrites=true&w=majority&appName=Cluster0}

service.delivery.url=${SERVICE_DELIVERY_URL:http://localhost:8085}
service.notification.url=${SERVICE_NOTIFICATION_URL:http://localhost:8086}

# Actuator — expose health + prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Distributed tracing → Jaeger via OTLP
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
