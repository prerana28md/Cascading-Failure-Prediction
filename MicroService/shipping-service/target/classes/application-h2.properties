spring.application.name=shipping-service
server.port=8084

spring.datasource.url=jdbc:h2:mem:shipping_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

service.delivery.url=http://localhost:8085
service.notification.url=http://localhost:8086
