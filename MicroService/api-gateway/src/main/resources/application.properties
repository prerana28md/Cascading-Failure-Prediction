spring.application.name=api-gateway
server.port=8080

service.order.url=${SERVICE_ORDER_URL:http://localhost:8081}
service.payment.url=${SERVICE_PAYMENT_URL:http://localhost:8082}
service.inventory.url=${SERVICE_INVENTORY_URL:http://localhost:8083}
service.shipping.url=${SERVICE_SHIPPING_URL:http://localhost:8084}
service.delivery.url=${SERVICE_DELIVERY_URL:http://localhost:8085}
service.notification.url=${SERVICE_NOTIFICATION_URL:http://localhost:8086}

# Actuator — expose health + prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Distributed tracing → Jaeger via OTLP
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# JWT — must match the secret used by order-service
jwt.secret=${JWT_SECRET:cascade-failure-prediction-super-secret-key-2024-min32chars}

# Fault events are sent to the monitoring/Omnistore catalog and retained in the gateway outbox until acknowledged.
omnistore.events-url=${OMNISTORE_EVENTS_URL:http://localhost:5001/api/fault-events}
omnistore.outbox-path=${OMNISTORE_OUTBOX_PATH:fault-event-outbox.jsonl}
omnistore.history-path=${OMNISTORE_HISTORY_PATH:fault-event-history.jsonl}
omnistore.retry-ms=${OMNISTORE_RETRY_MS:10000}
