spring.application.name=payment-service
server.port=8082

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://Poornima15:poornima15@cluster0.f46nymd.mongodb.net/payment_db?retryWrites=true&w=majority&appName=Cluster0}

service.notification.url=${SERVICE_NOTIFICATION_URL:http://localhost:8086}

# Actuator — expose health + prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
