spring.application.name=inventory-service
server.port=8083

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://Poornima15:poornima15@cluster0.f46nymd.mongodb.net/inventory_db?retryWrites=true&w=majority&appName=Cluster0}

# Actuator — expose health + prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Distributed tracing → Jaeger via OTLP
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# JWT — must match the secret used by order-service and api-gateway
jwt.secret=${JWT_SECRET:cascade-failure-prediction-super-secret-key-2024-min32chars}
